<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Electron Real Runtime Fixture</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #eef2f7; }
        #counter-value { font-size: 24px; font-weight: bold; margin: 10px 0; }
        button { padding: 8px 16px; background: #2b5797; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Electron Real App</h1>
    <div id="counter-value">0</div>
    <button id="increment-btn" onclick="document.getElementById('counter-value').textContent = parseInt(document.getElementById('counter-value').textContent) + 1">Increment</button>
    <div style="margin-top: 10px;">
        <input id="test-input" type="text" placeholder="Type here..." />
    </div>
</body>
</html>
